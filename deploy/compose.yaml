services:
  vaultview:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: vaultview-server:local
    restart: unless-stopped
    environment:
      VAULT_ROOT: /vault
      VAULT_NAME: ${VAULT_NAME:-Vault}
      LISTEN_ADDR: 0.0.0.0:8080
    volumes:
      - /srv/Vault:/vault:ro
    ports:
      - 127.0.0.1:${VAULTVIEW_PORT:-8080}:8080
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/vaultview-server", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
