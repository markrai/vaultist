name: Server CI

on:
  push:
    paths: ["server/**", "api/**", "deploy/**", ".github/workflows/server-ci.yml"]
  pull_request:
    paths: ["server/**", "api/**", "deploy/**", ".github/workflows/server-ci.yml"]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test
        working-directory: server
        run: go test -race ./...
      - name: Vet
        working-directory: server
        run: go vet ./...
      - name: Build static server
        working-directory: server
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./cmd/vaultist-server
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@1.34.5 lint api/openapi.yaml
      - name: Validate Compose
        working-directory: deploy
        run: docker compose config --quiet
      - name: Build container
        run: docker build -f server/Dockerfile server
